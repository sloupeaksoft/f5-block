name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare Forge MDK
        run: |
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          cp -r src mdk/src
          cd mdk
          sed -i 's#files.minecraftforge.net/maven#maven.minecraftforge.net#g' build.gradle
          sed -i 's#jcenter()#mavenCentral()#g' build.gradle
          chmod +x gradlew

      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NoThirdPerson-jar
          path: mdk/build/libs/*.jar
